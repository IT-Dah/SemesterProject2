<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse all listings available for bidding on Velorum." />
    <title>Listings - Velorum</title>
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="container my-5" role="main">
      <section aria-labelledby="listings-heading">
        <h1 id="listings-heading">Browse Listings</h1>

        <div class="filter-sort mb-4 d-flex justify-content-between align-items-center">
          <div class="filters">
            <label for="search" class="form-label">Search Listings:</label>
            <input type="text" id="search" class="form-control" placeholder="Search by title or description" />
          </div>
          <div class="sort-options">
            <label for="sort" class="form-label">Sort By:</label>
            <select id="sort" class="form-select">
              <option value="endsAt" selected>Ending Soon</option>
              <option value="startsAt">Newest</option>
            </select>
          </div>
        </div>

        <div id="card-container" class="row" aria-live="polite"></div>

        <nav class="pagination mt-4 d-flex justify-content-between" aria-label="Pagination">
          <button id="prev-page" class="btn btn-primary" disabled>Previous</button>
          <button id="next-page" class="btn btn-primary">Next</button>
        </nav>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Only this script -->
    <script type="module" src="../../js/main.js"></script>
  </body>
</html>
