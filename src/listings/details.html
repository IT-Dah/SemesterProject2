<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View detailed information and place bids on listings at Velorum." />
    <title>Listing Details - Velorum</title>
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>
    <main class="container my-5">
      <article id="listing-container" aria-busy="true">
        <p>Loading listing...</p>
      </article>
      <section id="bid-section" aria-labelledby="bid-section-heading">
        <h2 id="bid-section-heading">Place a Bid</h2>
        <form id="bid-form" aria-live="polite">
          <div class="mb-3">
            <label for="bid-amount" class="form-label">Your Bid (NOK):</label>
            <input
              type="number"
              id="bid-amount"
              class="form-control"
              placeholder="Enter your bid"
              min="1"
              required
              aria-required="true" />
          </div>
          <button type="submit" class="btn btn-primary">Place Bid</button>
        </form>
      </section>
    </main>
    <div id="footer-placeholder"></div>
    <script type="module">
  import { setupResponsiveNavbar } from "../../js/utils/menu.js";
  import "../../js/components/details.js"; // details.js self-inits on DOMContentLoaded
  document.addEventListener("DOMContentLoaded", setupResponsiveNavbar);
</script>
  </body>
</html>
